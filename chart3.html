<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>钢材质量指标查询系统</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:"微软雅黑";}
        body{background:#f5f7fa;}
        /* 登录样式 */
        .login-box{width:400px;margin:120px auto;background:#fff;padding:35px;border-radius:8px;box-shadow:0 0 15px #ddd;}
        .login-box h3{text-align:center;margin-bottom:25px;color:#2c3e50;font-size:20px;}
        .login-item{margin-bottom:18px;}
        .login-item label{display:block;margin-bottom:6px;color:#555;}
        .login-item input{width:100%;height:40px;padding:0 12px;border:1px solid #ccc;border-radius:4px;}
        .login-btn{width:100%;height:42px;background:#1677ff;color:#fff;border:none;border-radius:4px;font-size:16px;cursor:pointer;}
        .tip{color:red;font-size:13px;margin-top:10px;text-align:center;display:none;}
        /* 主页面 */
        .main-page{display:none;padding:20px;}
        .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;background:#fff;padding:15px;border-radius:6px;}
        .logout{padding:6px 15px;background:#f53f3f;color:#fff;border:none;border-radius:4px;cursor:pointer;}
        .box{background:#fff;border-radius:8px;padding:25px;box-shadow:0 2px 8px #eee;max-width:1750px;margin:0 auto;}
        h2{text-align:center;color:#2c3e50;margin-bottom:25px;}
        /* 查询区 */
        .search-row{display:flex;flex-wrap:wrap;gap:15px;margin-bottom:20px;align-items:center;}
        .search-item label{display:block;margin-bottom:5px;color:#555;}
        .search-item input,.search-item select{width:180px;height:36px;padding:0 10px;border:1px solid #ccc;border-radius:4px;}
        .btn{padding:8px 22px;border:none;border-radius:4px;cursor:pointer;font-size:15px;}
        .search-btn{background:#1677ff;color:#fff;}
        .reset-btn{background:#999;color:#fff;}
        .export-btn{background:#00b42a;color:#fff;}
        /* 指标按钮 */
        .btn-group{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0;}
        .tab-btn{padding:7px 14px;border:1px solid #ccc;background:#fff;border-radius:4px;cursor:pointer;}
        .tab-btn.active{background:#1677ff;color:#fff;border-color:#1677ff;}
        /* 汇总表格 */
        #resultTableWrap{display:none;margin:10px 0 20px;overflow-x:auto;}
        table{width:100%;border-collapse:collapse;min-width:1680px;}
        th,td{border:1px solid #ddd;padding:8px;text-align:center;font-size:13px;white-space:nowrap;}
        th{background:#f0f5ff;}
        /* 超标标红 */
        .over-limit{color:#f53f3f;font-weight:bold;}
        /* 内嵌趋势图容器 */
        .chart-wrap{width:100%;height:340px;border:1px solid #e5e7eb;padding:12px;border-radius:6px;display:none;}
    </style>
</head>
<body>
<!-- 登录页 -->
<div class="login-box" id="loginPage">
    <h3>钢材质检数据查询系统</h3>
    <div class="login-item">
        <label>登录账号</label>
        <input type="text" id="username" placeholder="请输入账号">
    </div>
    <div class="login-item">
        <label>登录密码</label>
        <input type="password" id="pwd" placeholder="请输入密码">
    </div>
    <div class="tip" id="errTip">账号或密码错误，请重新输入</div>
    <button class="login-btn" onclick="login()">立即登录</button>
</div>

<!-- 主系统页面 -->
<div class="main-page" id="mainPage">
    <div class="header">
        <h3>轴承钢质量检测数据管理查询平台</h3>
        <span>当前登录用户：<span id="showUser">管理员</span></span>
        <button class="logout" onclick="logout()">退出登录</button>
    </div>
    <div class="box">
        <h2>炉号/钢种/规格/技术条件/检验日期/批次综合查询</h2>
        <div class="search-row">
            <div class="search-item">
                <label>炉号</label>
                <input type="text" id="furnace" placeholder="熔炼炉号">
            </div>
            <div class="search-item">
                <label>钢种</label>
                <select id="steelGrade">
                    <option value="">请选择</option>
                    <option>GCr15</option>
                    <option>GCr15SiMn</option>
                    <option>20Cr2Ni4A</option>
                </select>
            </div>
            <div class="search-item">
                <label>规格</label>
                <input type="text" id="spec" placeholder="Φ60、80×80">
            </div>
            <div class="search-item">
                <label>技术条件</label>
                <input list="techList" id="techCondition" placeholder="选择或手动输入标准">
                <datalist id="techList">
                    <option value="GB/T 18254-2018"></option>
                    <option value="GB/T 3077"></option>
                    <option value="YB/T 4173"></option>
                    <option value="订货技术协议A01"></option>
                    <option value="订货技术协议B02"></option>
                </datalist>
            </div>
            <div class="search-item">
                <label>检验开始日期</label>
                <input type="date" id="startCheckDate">
            </div>
            <div class="search-item">
                <label>检验结束日期</label>
                <input type="date" id="endCheckDate">
            </div>
            <div class="search-item">
                <label>批次号</label>
                <input type="text" id="batch" placeholder="生产批次">
            </div>
            <div style="margin-top:22px;display:flex;gap:10px;">
                <button class="btn search-btn" onclick="doQuery()">立即查询</button>
                <button class="btn reset-btn" onclick="doReset()">重置</button>
                <button class="btn export-btn">导出数据</button>
            </div>
        </div>

        <div style="margin:10px 0;color:#666;">点击下方按钮，查看对应指标历史趋势曲线</div>
        <!-- 指标切换按钮 -->
        <div class="btn-group" id="btnGroup">
            <button class="tab-btn" data-type="inclusion">夹杂物</button>
            <button class="tab-btn" data-type="carbide">碳化物</button>
            <button class="tab-btn" data-type="decar">脱碳</button>
            <button class="tab-btn" data-type="structure">组织</button>
            <button class="tab-btn" data-type="grain">晶粒度</button>
            <button class="tab-btn" data-type="lowmag">低倍</button>
            <button class="tab-btn" data-type="hardness">硬度</button>
            <button class="tab-btn" data-type="impact">冲击</button>
            <button class="tab-btn" data-type="strength">强度</button>
            <button class="tab-btn" data-type="harden">淬透性</button>
            <button class="tab-btn" data-type="element">成分</button>
            <button class="tab-btn" data-type="waterNdt">水浸探伤合格率</button>
            <button class="tab-btn" data-type="autoNdt">自动线探伤合格率</button>
        </div>

        <!-- 汇总数据表 -->
        <div id="resultTableWrap">
            <div class="table-title" style="font-size:16px;font-weight:bold;margin-bottom:10px;color:#333;border-left:4px solid #1677ff;padding-left:10px;">检验项目汇总数据表（红色数值代表超出标准）</div>
            <table>
                <thead>
                    <tr>
                        <th>炉号</th>
                        <th>钢种</th>
                        <th>规格</th>
                        <th>技术条件</th>
                        <th>批次号</th>
                        <th>检验日期</th>
                        <th>夹杂物等级</th>
                        <th>碳化物等级</th>
                        <th>脱碳层(mm)</th>
                        <th>组织等级</th>
                        <th>晶粒度</th>
                        <th>低倍评级</th>
                        <th>硬度HRC</th>
                        <th>冲击功(J)</th>
                        <th>抗拉强度(MPa)</th>
                        <th>淬硬层(mm)</th>
                        <th>C(%)</th>
                        <th>水浸探伤合格率(%)</th>
                        <th>自动线探伤合格率(%)</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
            </table>
        </div>

        <!-- 统一趋势图容器 -->
        <div class="chart-wrap" id="chartWrap">
            <canvas id="mainChart"></canvas>
        </div>
    </div>
</div>

<script>
// 账号列表
const userList = [
    {user:"admin",pwd:"123456",name:"系统管理员"},
    {user:"jc",pwd:"666666",name:"质检人员"},
    {user:"sc",pwd:"888888",name:"生产人员"}
];

// ====================== 标准阈值配置（新增探伤合格率标准）======================
const standardRange = {
    inclusion: {max:1.2},    // 夹杂物 ≤1.2
    carbide: {max:2.0},      // 碳化物 ≤2.0
    decar: {max:0.12},       // 脱碳层 ≤0.12mm
    structure: {max:3.0},    // 组织等级 ≤3.0
    grain: {min:6.0},        // 晶粒度 ≥6.0
    lowmag: {max:1.5},       // 低倍 ≤1.5
    hardness: {min:61,max:63}, // HRC 61~63
    impact: {min:30},        // 冲击功≥30J
    strength: {min:850},     // 抗拉≥850MPa
    harden: {min:17},        // 淬硬层≥17mm
    element: {min:0.93,max:0.98}, // C 0.93~0.98
    waterNdt: {min:98.0},    // 水浸探伤合格率 ≥98%
    autoNdt: {min:98.5}      // 自动线探伤合格率 ≥98.5%
};

// 模拟多条测试数据【新增两项探伤合格率】
const mockDataList = [
    {furnace:"L2026001",steel:"GCr15",spec:"Φ60",techCondition:"GB/T 18254-2018",batch:"P001",checkDate:"2026-07-01",
        inclusion:1.1,carbide:1.8,decar:0.11,structure:2.8,grain:7.0,lowmag:1.4,hardness:62.0,impact:33,strength:865,harden:18.0,element:0.95,
        waterNdt:98.2,autoNdt:98.8
    },
    {furnace:"L2026002",steel:"GCr15",spec:"Φ60",techCondition:"GB/T 18254-2018",batch:"P002",checkDate:"2026-07-05",
        inclusion:1.3,carbide:1.9,decar:0.13,structure:2.9,grain:6.8,lowmag:1.6,hardness:60.5,impact:31,strength:845,harden:17.2,element:0.99,
        waterNdt:97.5,autoNdt:98.2
    },
    {furnace:"L2026003",steel:"GCr15",spec:"Φ65",techCondition:"订货技术协议A01",batch:"P003",checkDate:"2026-07-10",
        inclusion:1.0,carbide:2.1,decar:0.10,structure:3.1,grain:7.2,lowmag:1.3,hardness:62.2,impact:35,strength:870,harden:16.8,element:0.94,
        waterNdt:98.5,autoNdt:99.0
    }
];

// 趋势配置（新增两项探伤趋势）
const batchLabel = ["P001","P002","P003"];
const trendConfig = {
    inclusion: {title:"非金属夹杂物综合等级趋势",data:[1.1,1.3,1.0]},
    carbide: {title:"碳化物等级变化趋势",data:[1.8,1.9,2.1]},
    decar: {title:"脱碳层厚度趋势(mm)",data:[0.11,0.13,0.10]},
    structure: {title:"显微组织等级趋势",data:[2.8,2.9,3.1]},
    grain: {title:"晶粒度级别趋势",data:[7.0,6.8,7.2]},
    lowmag: {title:"低倍缺陷综合等级趋势",data:[1.4,1.6,1.3]},
    hardness: {title:"钢材硬度HRC趋势",data:[62.0,60.5,62.2]},
    impact: {title:"冲击功数值趋势(J)",data:[33,31,35]},
    strength: {title:"抗拉强度趋势(MPa)",data:[865,845,870]},
    harden: {title:"淬硬层深度趋势(mm)",data:[18.0,17.2,16.8]},
    element: {title:"碳元素含量变化趋势(%)",data:[0.95,0.99,0.94]},
    waterNdt: {title:"水浸探伤合格率趋势(%)",data:[98.2,97.5,98.5]},
    autoNdt: {title:"自动线探伤合格率趋势(%)",data:[98.8,98.2,99.0]}
};

// 全局图表
let chartInstance = null;

// 登录
function login(){
    let u=document.getElementById("username").value.trim();
    let p=document.getElementById("pwd").value.trim();
    let tip=document.getElementById("errTip");
    let ok=false,name="";
    userList.forEach(item=>{
        if(u===item.user&&p===item.pwd){ok=true;name=item.name;}
    });
    if(ok){
        tip.style.display="none";
        document.getElementById("loginPage").style.display="none";
        document.getElementById("mainPage").style.display="block";
        document.getElementById("showUser").innerText=name;
    }else tip.style.display="block";
}

// 退出登录
function logout(){
    document.getElementById("loginPage").style.display="block";
    document.getElementById("mainPage").style.display="none";
    document.getElementById("username").value="";
    document.getElementById("pwd").value="";
    doReset();
}

// 判断数值是否超标
function isOverLimit(type,val){
    const std = standardRange[type];
    const num = parseFloat(val);
    if(std.min !== undefined && num < std.min) return true;
    if(std.max !== undefined && num > std.max) return true;
    return false;
}

// 渲染多条数据表格 + 自动标红
function renderTable(list){
    const tbody = document.getElementById("tableBody");
    tbody.innerHTML = "";
    list.forEach(row=>{
        const tr = document.createElement("tr");
        const cells = [
            row.furnace,row.steel,row.spec,row.techCondition,row.batch,row.checkDate,
            {v:row.inclusion,t:"inclusion"},
            {v:row.carbide,t:"carbide"},
            {v:row.decar,t:"decar"},
            {v:row.structure,t:"structure"},
            {v:row.grain,t:"grain"},
            {v:row.lowmag,t:"lowmag"},
            {v:row.hardness,t:"hardness"},
            {v:row.impact,t:"impact"},
            {v:row.strength,t:"strength"},
            {v:row.harden,t:"harden"},
            {v:row.element,t:"element"},
            {v:row.waterNdt,t:"waterNdt"},
            {v:row.autoNdt,t:"autoNdt"}
        ];
        cells.forEach(cell=>{
            let td = document.createElement("td");
            if(typeof cell === "string"){
                td.innerText = cell;
            }else{
                td.innerText = cell.v;
                if(isOverLimit(cell.t, cell.v)){
                    td.className = "over-limit";
                }
            }
            tr.appendChild(td);
        })
        tbody.appendChild(tr);
    })
}

// 渲染趋势图
function renderChart(type){
    const cfg = trendConfig[type];
    const ctx = document.getElementById("mainChart").getContext("2d");
    if(chartInstance) chartInstance.destroy();
    chartInstance = new Chart(ctx,{
        type:"line",
        data:{
            labels: batchLabel,
            datasets:[{
                label: cfg.title,
                data: cfg.data,
                borderColor:"#1677ff",
                backgroundColor:"rgba(22,119,255,0.12)",
                tension:0.3,
                fill:true
            }]
        },
        options:{
            responsive:true,
            maintainAspectRatio:false,
            plugins:{title:{display:true,text:cfg.title,font:{size:16}}}
        }
    })
}

// 指标按钮点击
document.querySelectorAll(".tab-btn").forEach(btn=>{
    btn.onclick=function(){
        let type=this.dataset.type;
        document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
        this.classList.add("active");
        document.getElementById("chartWrap").style.display="block";
        setTimeout(()=>renderChart(type),100);
    }
});

// 查询（带日期区间校验）
function doQuery(){
    let sDate = document.getElementById("startCheckDate").value;
    let eDate = document.getElementById("endCheckDate").value;

    if(sDate && !eDate){
        alert("已填写检验开始日期，请补充检验结束日期！");
        return;
    }
    if(!sDate && eDate){
        alert("已填写检验结束日期，请补充检验开始日期！");
        return;
    }
    if(sDate && eDate && new Date(sDate) > new Date(eDate)){
        alert("检验开始日期不能晚于检验结束日期！");
        return;
    }

    let techCond = document.getElementById("techCondition").value.trim();
    renderTable(mockDataList);
    document.getElementById("resultTableWrap").style.display="block";
    document.getElementById("chartWrap").style.display="none";
    document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
    alert(`查询完成\n检验日期：${sDate||"不限"} ~ ${eDate||"不限"}\n技术条件筛选：${techCond||"不限"}\n红色数值为超出标准项目，点击上方按钮查看趋势曲线`);
}

// 重置
function doReset(){
    document.querySelectorAll(".search-row input,.search-row select").forEach(el=>el.value="");
    document.getElementById("resultTableWrap").style.display="none";
    document.getElementById("chartWrap").style.display="none";
    document.getElementById("tableBody").innerHTML = "";
    document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
    if(chartInstance) chartInstance.destroy();
}
</script>
</body>
</html>
